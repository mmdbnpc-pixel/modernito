<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ایجاد فروشگاه</title>
    <link rel="stylesheet" href="assets/img/tailwind.min.css" />

    <style>
        @font-face {
            font-family: "IRANSansX";
            src: url("assets/Farsi-Digits-Without-Latin/IRANSansX-Regular.woff2") format("woff2");
            font-weight: 400;
        }

        @font-face {
            font-family: "IRANSansX";
            src: url("assets/Farsi-Digits-Without-Latin/IRANSansX-Bold.woff2") format("woff2");
            font-weight: 700;
        }

        * {
            font-family: "IRANSansX", sans-serif !important;
        }

        body {
            font-family: "IRANSansX", sans-serif;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }

        }

        .animate-card {
            opacity: 0;
            animation: fadeInUp 0.8s ease-out forwards;
        }

        .delay-100 {
            animation-delay: 0.1s;
        }

        .delay-200 {
            animation-delay: 0.2s;
        }

        .delay-300 {
            animation-delay: 0.3s;
        }

        .delay-400 {
            animation-delay: 0.4s;
        }

        .delay-500 {
            animation-delay: 0.5s;
        }

        .delay-600 {
            animation-delay: 0.6s;
        }
    </style>
</head>

<body class="bg-slate-100">

    <header class="relative flex items-center justify-between px-6 py-4 
               bg-white text-green-800 
               md:bg-green-900 md:text-white">

        <!-- بخش راست: دکمه همبرگری -->
        <!-- در موبایل و دسکتاپ نمایش داده میشه (کلاس md:hidden حذف شد) -->
        <button id="menuBtn"
            class="w-10 h-10 flex items-center justify-center rounded-lg hover:bg-black/10 transition ml-4">
            <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7"></path>
            </svg>
        </button>

        <!-- لوگو (وسط) -->
        <!-- در موبایل نمایش داده میشه، در دسکتاپ مخفی -->
        <div class="text-xl font-bold absolute left-0/2 transform -translate-x-1/2">
            Modernito
        </div>

        <!-- بخش چپ: پروفایل کاربر -->
        <!-- کل این بخش در موبایل مخفی و در دسکتاپ نمایش داده میشه -->
        <div class="relative ml-4 items-left hidden md:flex">
            <!-- دکمه پروفایل (عکس + فلش) -->
            <button id="profileBtn"
                class="flex items-center gap-2 bg-white/10 px-3 py-2 rounded-full hover:bg-white/20 transition">
                <!-- عکس گرد کاربر -->
                <img src="assets/img/boxgol1.png" alt="User"
                    class="w-8 h-8 rounded-full object-cover border border-white/30">
                <!-- فلش کوچک -->
                <svg class="w-4 h-4 transition-transform duration-200" id="profileArrow" fill="none"
                    stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                </svg>
            </button>

            <!-- باکش نمایش مشخصات کاربر (Dropdown) -->
            <div id="userProfileDropdown"
                class="absolute top-full left-0 mt-2 w-64 bg-green-800 backdrop-blur-xl border border-green-600 rounded-2xl shadow-3xl z-50 hidden flex-col overflow-hidden">

                <div class="p-4 flex flex-col gap-3">
                    <div class="flex items-center gap-3 border-b border-green-700 pb-3">
                        <img src="assets/img/boxgol1.png" class="w-12 h-12 rounded-full">
                        <div>
                            <p class="font-bold text-white">نام کاربر</p>
                            <p class="text-sm text-green-200">user@example.com</p>
                        </div>
                    </div>
                    <a href="#"
                        class="block px-3 py-2 rounded text-center hover:bg-white/10 text-white transition">پروفایل
                        من</a>
                    <a href="#"
                        class="block px-3 py-2 rounded text-center hover:bg-white/10 text-white transition">داشبورد</a>
                    <a href="#"
                        class="block px-3 py-2 rounded text-center hover:bg-red-500/20 text-red-300 transition">خروج</a>
                </div>
            </div>
        </div>

        <!-- منوی بازشونده اصلی (سمت راست، زیر دکمه همبرگری) -->
        <!-- در موبایل و دسکتاپ نمایش داده میشه -->
        <!-- در دسکتاپ کمی تغییر استایل دادیم که بهتر دیده بشه -->
        <div id="mobileMenu"
            class="absolute top-full right-0 mt-2 mr-4 w-64 bg-green-900 text-white backdrop-blur-xl border border-gray-700 rounded-2xl shadow-3xl z-50 hidden flex-col overflow-y-auto">
            <div class="flex flex-col p-8 gap-4 h-20vh md:min-h-[40vh]">
                <a href="#"
                    class="block px-4 py-3 rounded-lg hover:bg-white/10 transition text-white text-lg font-medium">داشبورد</a>
                <a href="#"
                    class="block px-4 py-3 rounded-lg hover:bg-white/10 transition text-white text-lg font-medium">فروشگاه‌ها</a>
                <a href="#"
                    class="block px-4 py-3 rounded-lg hover:bg-white/10 transition text-white text-lg font-medium">ایجاد
                    فروشگاه</a>
                <a href="#"
                    class="block px-4 py-3 rounded-lg hover:bg-white/10 transition text-white text-lg font-medium">تماس
                    با ما</a>
            </div>
        </div>
    </header>

    <div class="flex p-8 gap-0 h-start md:min">
        <a href="#" class="block px-4 py-0 text-gray-700 text-lg font-medium">داشبورد</a>
        <h3>/</h3>
        <a href="store-list.html" class="block px-4 py-0 text-gray-700 text-lg font-medium">فروشگاه‌ها</a>
        <h3>/</h3>
        <a href="store.html" class="block px-4 py-0 text-green-700 text-lg font-medium">ایجاد فروشگاه</a>
    </div>
    <section class="max-w-7xl mx-auto px-4 py-12 md:mt-20">
        <div class="flex flex-col lg:flex-row-reverse gap-10">

            <div class="bg-white shadow-xl rounded-xl p-7 w-full lg:w-[620px]">

                <h2 class="text-2xl font-bold text-gray-700 mb-6">
                    ایجاد فروشگاه
                </h2>

                <form id="productForm" class="flex flex-col gap-5">

                    <div>
                        <label class="font-semibold text-sm">نام فروشگاه</label>
                        <input id="productName" type="text"
                            class="w-full mt-1 border border-green-300 rounded-lg px-4 py-2.5 focus:ring-2 focus:ring-green-600 focus:border-green-600 outline-none">
                    </div>

                    <div>
                        <label class="font-semibold text-sm">دسته‌بندی</label>
                        <select id="productCategory"
                            class="w-full mt-1 border border-green-300 rounded-lg px-4 py-2.5 focus:ring-2 focus:ring-green-600 focus:border-green-600 outline-none">

                            <option value="">انتخاب کنید</option>
                            <option value="گل">گل</option>
                            <option value="پوشاک">پوشاک</option>
                            <option value="خودرو">خودرو</option>
                            <option value="لوازم آرایشی">لوازم آرایشی</option>

                        </select>
                    </div>

                    <div>
                        <label class="font-semibold text-sm">توضیحات فروشگاه</label>
                        <textarea id="productDescription" rows="4"
                            class="w-full mt-1 border border-green-300 rounded-lg px-4 py-2.5 focus:ring-2 focus:ring-green-600 focus:border-green-600 outline-none"></textarea>
                    </div>

                    <div>
                        <label class="font-semibold text-sm block mb-1">افزودن بنر</label>
                        <label for="bannerImage"
                            class="w-full mt-1 border border-green-300 rounded-lg px-4 py-6 bg-gray-50 cursor-pointer flex items-center justify-center gap-2 hover:bg-green-100 transition">
                            <span class="text-green-600 text-sm">بنر خود را اضافه کنید</span>
                        </label>
                        <input id="bannerImage" type="file" class="hidden" accept="image/*">

                        <br>

                        <label class="font-semibold text-sm block mb-1">آپلود لوگو</label>
                        <label for="logoImage"
                            class="w-full mt-1 border-2 border-dashed border-green-300 rounded-lg px-4 py-8 bg-gray-50 cursor-pointer flex flex-col items-center justify-center gap-2 hover:border-blue-400 hover:bg-blue-50 transition">
                            <span class="text-green-600 text-sm">برای آپلود لوگو کلیک کنید</span>
                            <span class="text-green-400 text-xs">PNG, JPG, JPEG</span>
                        </label>
                        <input id="logoImage" type="file" class="hidden" accept="image/*">
                    </div>

                    <button type="submit"
                        class="mt-3 bg-green-700 hover:bg-green-800 text-white py-3 rounded-lg font-semibold text-lg transition">
                        افزودن فروشگاه
                    </button>

                </form>
            </div>
        </div>
    </section>

    <footer class="bg-green-900 text-white mt-16">
        <div class="max-w-7xl mx-auto text-center px-4 py-12 grid grid-cols-1 md:grid-cols-3 gap-10 text-sm">

            <div>
                <p class="font-bold text-lg mb-3">صفحات</p>
                <a class="block hover:text-green-300 transition" href="./admin.html">خانه</a>
                <a class="block hover:text-green-300 transition" href="#">درباره ما</a>
            </div>

            <div>
                <p class="font-bold text-lg mb-3 text-center">ارتباط با ما</p>
                <a class="block hover:text-green-300 transition text-center" href="#">اینستاگرام</a>
                <a class="block hover:text-green-300 transition text-center" href="#">تلگرام</a>
                <a class="block hover:text-green-300 transition text-center" href="#">ایتا</a>
            </div>

            <div>
                <p class="font-bold text-lg mb-3">فروشگاه</p>
                <a class="block hover:text-green-300 transition" href="#">محصولات</a>
                <a class="block hover:text-green-300 transition" href="#">دسته‌بندی‌ها</a>
            </div>

        </div>

        <div>
            <a class="block hover:text-green-300 text-center transition" href="https://modernitoweb.ir/">طراحی و توسعه
                توسط مدرنیتو</a>
        </div>
    </footer>
    <script>
        // ۱. کد مربوط به فرم محصول (بدون تغییر)
        document.getElementById("productForm").addEventListener("submit", async function (e) {
            e.preventDefault();

            const name = document.getElementById("productName").value;
            const category = document.getElementById("productCategory").value;
            const description = document.getElementById("productDescription").value;

            const productData = {
                shop_id: 1,
                name: name,
                category: category,
                description: description,
                price: 1000,
                stock: 10
            };

            try {
                const response = await fetch("https://modernitoweb.ir/marketplace-api/shops.php?action=create", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(productData)
                });

                const result = await response.json();

                if (!response.ok) {
                    console.error("Server Error:", result);
                    alert("خطا: " + (result.error || "مشکلی پیش آمد"));
                } else {
                    console.log("Success:", result);
                    alert("با موفقیت ثبت شد");
                    this.reset();
                }
            } catch (error) {
                console.error("Fetch Error:", error);
                alert("خطا در برقراری ارتباط با سرور");
            }
        });

        // ۲. کد منوی همبرگری (سمت راست) - اصلاح شده برای کار در دسکتاپ و موبایل
        const menuBtn = document.getElementById('menuBtn');
        const mobileMenu = document.getElementById('mobileMenu');

        menuBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            if (mobileMenu.classList.contains('hidden')) {
                mobileMenu.classList.remove('hidden');
                mobileMenu.classList.add('flex');
            } else {
                mobileMenu.classList.add('hidden');
                mobileMenu.classList.remove('flex');
            }
        });

        document.addEventListener('click', (e) => {
            if (!mobileMenu.contains(e.target) && !menuBtn.contains(e.target)) {
                mobileMenu.classList.add('hidden');
                mobileMenu.classList.remove('flex');
            }
        });

        // ۳. کد منوی کنار عکس (سمت چپ) - اضافه شده
        const profileBtn = document.getElementById('profileBtn');
        const userProfileDropdown = document.getElementById('userProfileDropdown');
        const profileArrow = document.getElementById('profileArrow');

        profileBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            userProfileDropdown.classList.toggle('hidden');
            userProfileDropdown.classList.toggle('flex');
            profileArrow.classList.toggle('rotate-180');
        });

        document.addEventListener('click', (e) => {
            if (!userProfileDropdown.contains(e.target) && !profileBtn.contains(e.target)) {
                userProfileDropdown.classList.add('hidden');
                userProfileDropdown.classList.remove('flex');
                profileArrow.classList.remove('rotate-180');
            }
        });
    </script>

</body>

</html>
