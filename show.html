<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نمایش فروشگاه</title>
    <link rel="stylesheet" href="assets/img/tailwind.min.css" />

    <style>
        @font-face {
            font-family: "IRANSansX";
            src: url("assets/Farsi-Digits-Without-Latin/IRANSansX-Regular.woff2") format("woff2");
            font-weight: 400;
        }

        @font-face {
            font-family: "IRANSansX";
            src: url("assets/Farsi-Digits-Without-Latin/IRANSansX-Bold.woff2") format("woff2");
            font-weight: 700;
        }

        * {
            font-family: "IRANSansX", sans-serif !important;
        }

        body {
            font-family: "IRANSansX", sans-serif;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }

        }

        .animate-card {
            opacity: 0;
            animation: fadeInUp 0.8s ease-out forwards;
        }

        .delay-100 {
            animation-delay: 0.1s;
        }

        .delay-200 {
            animation-delay: 0.2s;
        }

        .delay-300 {
            animation-delay: 0.3s;
        }

        .delay-400 {
            animation-delay: 0.4s;
        }

        .delay-500 {
            animation-delay: 0.5s;
        }

        .delay-600 {
            animation-delay: 0.6s;
        }
    </style>
</head>

<body class="bg-slate-100">

    <header class="relative flex items-center justify-between px-6 py-4 
               bg-white text-green-800 
               md:bg-green-900 md:text-white">

        <!-- بخش راست: دکمه همبرگری -->
        <!-- در موبایل و دسکتاپ نمایش داده میشه (کلاس md:hidden حذف شد) -->
        <button id="menuBtn"
            class="w-10 h-10 flex items-center justify-center rounded-lg hover:bg-black/10 transition ml-4">
            <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7"></path>
            </svg>
        </button>

        <!-- لوگو (وسط) -->
        <!-- در موبایل نمایش داده میشه، در دسکتاپ مخفی -->
        <div class="text-xl font-bold absolute left-0/2 transform -translate-x-1/2">
            Modernito
        </div>

        <!-- بخش چپ: پروفایل کاربر -->
        <!-- کل این بخش در موبایل مخفی و در دسکتاپ نمایش داده میشه -->
        <div class="relative ml-4 items-left hidden md:flex">
            <!-- دکمه پروفایل (عکس + فلش) -->
            <button id="profileBtn"
                class="flex items-center gap-2 bg-white/10 px-3 py-2 rounded-full hover:bg-white/20 transition">
                <!-- عکس گرد کاربر -->
                <img src="assets/img/boxgol1.png" alt="User"
                    class="w-8 h-8 rounded-full object-cover border border-white/30">
                <!-- فلش کوچک -->
                <svg class="w-4 h-4 transition-transform duration-200" id="profileArrow" fill="none"
                    stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                </svg>
            </button>

            <!-- باکش نمایش مشخصات کاربر (Dropdown) -->
            <div id="userProfileDropdown"
                class="absolute top-full left-0 mt-2 w-64 bg-green-800 backdrop-blur-xl border border-green-600 rounded-2xl shadow-3xl z-50 hidden flex-col overflow-hidden">

                <div class="p-4 flex flex-col gap-3">
                    <div class="flex items-center gap-3 border-b border-green-700 pb-3">
                        <img src="assets/img/boxgol1.png" class="w-12 h-12 rounded-full">
                        <div>
                            <p class="font-bold text-white">نام کاربر</p>
                            <p class="text-sm text-green-200">user@example.com</p>
                        </div>
                    </div>
                    <a href="#"
                        class="block px-3 py-2 rounded text-center hover:bg-white/10 text-white transition">پروفایل
                        من</a>
                    <a href="#"
                        class="block px-3 py-2 rounded text-center hover:bg-white/10 text-white transition">داشبورد</a>
                    <a href="#"
                        class="block px-3 py-2 rounded text-center hover:bg-red-500/20 text-red-300 transition">خروج</a>
                </div>
            </div>
        </div>

        <!-- منوی بازشونده اصلی (سمت راست، زیر دکمه همبرگری) -->
        <!-- در موبایل و دسکتاپ نمایش داده میشه -->
        <!-- در دسکتاپ کمی تغییر استایل دادیم که بهتر دیده بشه -->
        <div id="mobileMenu"
            class="absolute top-full right-0 mt-2 mr-4 w-64 bg-green-900 text-white backdrop-blur-xl border border-gray-700 rounded-2xl shadow-3xl z-50 hidden flex-col overflow-y-auto">
            <div class="flex flex-col p-8 gap-4 h-20vh md:min-h-[40vh]">
                <a href="#"
                    class="block px-4 py-3 rounded-lg hover:bg-white/10 transition text-white text-lg font-medium">داشبورد</a>
                <a href="#"
                    class="block px-4 py-3 rounded-lg hover:bg-white/10 transition text-white text-lg font-medium">فروشگاه‌ها</a>
                <a href="#"
                    class="block px-4 py-3 rounded-lg hover:bg-white/10 transition text-white text-lg font-medium">ایجاد
                    فروشگاه</a>
                <a href="#"
                    class="block px-4 py-3 rounded-lg hover:bg-white/10 transition text-white text-lg font-medium">تماس
                    با ما</a>
            </div>
        </div>
    </header>


    <main class="flex-grow px-4 sm:px-6 md:px-8 py-8">

        <div class="max-w-2xl w-full mx-auto">

            <div class="bg-green-100 rounded-xl shadow-md p-4 sm:p-6 text-center mb-5 animate-fade-in delay-1">
                <h1 id="brandName" class="text-xl sm:text-2xl md:text-3xl font-bold text-green-800">در حال بارگذاری...
                </h1>
            </div>

            <div class="bg-green-100 rounded-xl shadow-md p-3 sm:p-4 mb-5 animate-fade-in delay-2">
                <img id="banner" class="w-full h-40 sm:h-48 md:h-56 object-cover rounded-lg" alt="بنر فروشگاه">
            </div>

            <div class="bg-green-100 rounded-xl shadow-md p-4 sm:p-6 flex justify-center mb-5 animate-fade-in delay-3">
                <img id="logo"
                    class="w-24 h-24 sm:w-28 sm:h-28 md:w-32 md:h-32 rounded-full border-4 border-white shadow-lg"
                    alt="لوگو فروشگاه">
            </div>

            <div class="bg-green-100 rounded-xl shadow-md p-4 sm:p-6 text-center mb-5 animate-fade-in delay-4">
                <p class="font-semibold text-base sm:text-lg text-green-800">
                    دسته‌بندی:
                    <span id="category" class="text-green-900 font-normal">-</span>
                </p>
            </div>

            <div class="bg-green-100 rounded-xl shadow-md p-4 sm:p-6 text-center animate-fade-in delay-5">
                <p id="description" class="text-green-900 text-sm sm:text-base leading-relaxed">-</p>
            </div>

        </div>
    </main>

    <footer class="bg-green-900 text-white mt-16">
        <div class="max-w-7xl mx-auto text-center px-4 py-12 grid grid-cols-1 md:grid-cols-3 gap-10 text-sm">
            <div>
                <p class="font-bold text-lg mb-3">صفحات</p>
                <a class="block hover:text-green-300 transition" href="./admin.html">خانه</a>
                <a class="block hover:text-green-300 transition" href="#">درباره ما</a>
            </div>
            <div>
                <p class="font-bold text-lg mb-3 text-ceneter">ارتباط با ما</p>
                <a class="block hover:text-green-300 transition text-ceneter" href="#">اینستاگرام</a>
                <a class="block hover:text-green-300 transition text-ceneter" href="#">تلگرام</a>
                <a class="block hover:text-green-300 transition text-ceneter" href="#">ایتا</a>
            </div>
            <div>
                <p class="font-bold text-lg mb-3">فروشگاه</p>
                <a class="block hover:text-green-300 transition" href="#">محصولات</a>
                <a class="block hover:text-green-300 transition" href="#">دسته‌بندی‌ها</a>
            </div>
        </div>
        <div>
            <a class="block hover:text-green-300 text-center transition" href="https://modernitoweb.ir/">طراحی و توسعه
                توسط مدرنیتو</a>
        </div>
    </footer>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            // دریافت پارامتر ID از URL (مثلاً show.html?id=1)
            const urlParams = new URLSearchParams(window.location.search);
            const storeId = urlParams.get('id');
            const storeName = urlParams.get('name');

            const brandNameEl = document.getElementById("brandName");
            const bannerEl = document.getElementById("banner");
            const logoEl = document.getElementById("logo");
            const categoryEl = document.getElementById("category");
            const descriptionEl = document.getElementById("description");

            // تابع برای نمایش داده‌ها
            function displayData(data) {
                if (data) {
                    brandNameEl.textContent = data.name || "نام فروشگاه";
                    bannerEl.src = data.banner || "https://via.placeholder.com/600x200?text=بنر";
                    logoEl.src = data.logo || "https://via.placeholder.com/150?text=لوگو";
                    categoryEl.textContent = data.category || "بدون دسته‌بندی";
                    descriptionEl.textContent = data.description || "توضیحاتی موجود نیست.";
                } else {
                    brandNameEl.textContent = "فروشگاه یافت نشد";
                    bannerEl.src = "";
                    logoEl.src = "";
                    categoryEl.textContent = "-";
                    descriptionEl.textContent = "اطلاعاتی برای نمایش وجود ندارد.";
                }
            }

            // اگر ID یا نام در URL باشد، از API بگیر
            if (storeId || storeName) {
                let apiUrl = "https://modernitoweb.ir//marketplace-api/shops.php";

                // اگر ID داریم، از آن استفاده کن، اگر نه از نام
                if (storeId) {
                    apiUrl += `?id=${storeId}`;
                } else if (storeName) {
                    apiUrl += `?name=${encodeURIComponent(storeName)}`;
                }

                fetch(apiUrl)
                    .then(response => {
                        if (!response.ok) {
                            throw new Error('خطا در دریافت اطلاعات');
                        }
                        return response.json();
                    })
                    .then(data => {
                        // فرض بر این است که API یک آبجکت یا آرایه برمی‌گرداند
                        // اگر API آرایه برمی‌گرداند، باید اولین آیتم را بگیریم
                        const storeData = Array.isArray(data) ? data[0] : data;
                        displayData(storeData);
                    })
                    .catch(error => {
                        console.error('خطا:', error);
                        brandNameEl.textContent = "خطا در بارگذاری اطلاعات";
                        descriptionEl.textContent = "متاسفانه اطلاعات فروشگاه بارگذاری نشد.";
                    });
            } else {
                // اگر هیچ پارامتری در URL نبود، از localStorage چک کن (برای تست)
                const localData = localStorage.getItem("storeData");
                if (localData) {
                    const data = JSON.parse(localData);
                    displayData(data);
                } else {
                    brandNameEl.textContent = "هیچ اطلاعاتی یافت نشد";
                    descriptionEl.textContent = "لطفاً ابتدا یک فروشگاه را ثبت کنید.";
                }
            }
        });
    </script>
    <script>
     const menuBtn = document.getElementById('menuBtn');
        const mobileMenu = document.getElementById('mobileMenu');

        menuBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            if (mobileMenu.classList.contains('hidden')) {
                mobileMenu.classList.remove('hidden');
                mobileMenu.classList.add('flex');
            } else {
                mobileMenu.classList.add('hidden');
                mobileMenu.classList.remove('flex');
            }
        });

        document.addEventListener('click', (e) => {
            if (!mobileMenu.contains(e.target) && !menuBtn.contains(e.target)) {
                mobileMenu.classList.add('hidden');
                mobileMenu.classList.remove('flex');
            }
        });

        // ۳. کد منوی کنار عکس (سمت چپ) - اضافه شده
        const profileBtn = document.getElementById('profileBtn');
        const userProfileDropdown = document.getElementById('userProfileDropdown');
        const profileArrow = document.getElementById('profileArrow');

        profileBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            userProfileDropdown.classList.toggle('hidden');
            userProfileDropdown.classList.toggle('flex');
            profileArrow.classList.toggle('rotate-180');
        });

        document.addEventListener('click', (e) => {
            if (!userProfileDropdown.contains(e.target) && !profileBtn.contains(e.target)) {
                userProfileDropdown.classList.add('hidden');
                userProfileDropdown.classList.remove('flex');
                profileArrow.classList.remove('rotate-180');
            }
        });
    </script>

</body>

</html>
